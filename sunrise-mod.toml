id = "jei"
name = "JEI"
version = "0.5.5"
description = "Just Enough Items on Sunrise: the item list and search in the game's own panel, R/U recipes and uses, the recipe window, \"+\" transfer and bookmarks, with a data-driven API for other mods' recipe categories."
authors = ["Sunrise port: Joeypc6", "mezz"]
api = "0.2"
side = "both"
capabilities = ["registries"]
license = "MIT"
license_url = "https://github.com/Joeypc6/JEI-Sunrise/blob/main/LICENSE"
credits = "Sunrise port by Joeypc6, based on Just Enough Items by mezz (MIT)."
homepage = "https://github.com/Joeypc6/JEI-Sunrise"
issues = "https://github.com/Joeypc6/JEI-Sunrise/issues"

[dependencies]
# W over an item in the panel or the recipe window opens its guide page when GuideME is installed.
guideme = { version = "^0.1", optional = true }

[native]
game = "26.3"
# Pinned to Sunrise Dev 2026-11-24 (f8aa80e).
sunrise = "f8aa80e4c40cf1a5d30e85d13937f3fcf06d8237"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
